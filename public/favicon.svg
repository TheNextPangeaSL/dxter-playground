<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3388ff"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="grid" x1="6" y1="6" x2="26" y2="26" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#e0e7ff" stop-opacity="0.9"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="7" fill="url(#bg)"/>
  <!-- Grid lines -->
  <line x1="14" y1="7" x2="14" y2="25" stroke="rgba(255,255,255,0.25)" stroke-width="0.75"/>
  <line x1="19" y1="7" x2="19" y2="25" stroke="rgba(255,255,255,0.25)" stroke-width="0.75"/>
  <line x1="7" y1="13" x2="25" y2="13" stroke="rgba(255,255,255,0.25)" stroke-width="0.75"/>
  <line x1="7" y1="18" x2="25" y2="18" stroke="rgba(255,255,255,0.25)" stroke-width="0.75"/>
  <!-- Revealed cells with heatmap colors -->
  <rect x="7" y="7" width="6.5" height="5.5" rx="1" fill="#22c55e" opacity="0.85"/>
  <rect x="14.5" y="13.5" width="4" height="4" rx="1" fill="#ef4444" opacity="0.9"/>
  <rect x="19.5" y="7" width="5.5" height="5.5" rx="1" fill="#f59e0b" opacity="0.85"/>
  <rect x="7" y="18.5" width="6.5" height="6" rx="1" fill="#2563eb" opacity="0.8"/>
  <rect x="19.5" y="18.5" width="5.5" height="6" rx="1" fill="#34d399" opacity="0.8"/>
  <!-- Optimum marker (star/diamond) -->
  <circle cx="16.5" cy="15.5" r="2.2" fill="#ff1493" opacity="0.95"/>
  <circle cx="16.5" cy="15.5" r="1" fill="white" opacity="0.9"/>
  <!-- Subtle sparkle -->
  <circle cx="10" cy="10" r="0.8" fill="white" opacity="0.7"/>
  <circle cx="22" cy="21" r="0.8" fill="white" opacity="0.7"/>
</svg>
